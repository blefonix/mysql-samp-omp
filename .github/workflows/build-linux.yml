name: Build Linux i386

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          docker build \
            --build-arg UBUNTU_VERSION=20.04 \
            -f docker/ci/linux-build.Dockerfile \
            -t mysql-samp-omp-build .

          mkdir -p dist

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            mysql-samp-omp-build \
            bash -lc '
              cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DFORCE_32_BIT=ON \
                -DOPENSSL_SSL_LIBRARY=/usr/lib/i386-linux-gnu/libssl.so \
                -DOPENSSL_CRYPTO_LIBRARY=/usr/lib/i386-linux-gnu/libcrypto.so \
                -DCMAKE_POSITION_INDEPENDENT_CODE=ON

              cmake --build build --parallel

              scripts/ci/check-linux-mysql-symbols.sh

              cp build/src/mysql.so dist/mysql.so
              cp build/src/a_mysql.inc dist/a_mysql.inc
              cp "$(find build -type f -name 'libmariadb.so.3' | head -n 1)" dist/libmariadb.so.3
            '

      - name: Verify artifacts
        run: |
          file dist/mysql.so
          file dist/libmariadb.so.3
          readelf -d dist/libmariadb.so.3 | grep NEEDED
          readelf --version-info dist/libmariadb.so.3 | grep OPENSSL | head -10

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mysql-r42-linux-i386
          path: dist/
